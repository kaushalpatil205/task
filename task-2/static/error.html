<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Not Found</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #161b22;
      border: 1px solid #da3633;
      border-radius: 8px;
      padding: 32px;
      max-width: 450px;
      text-align: center;
    }
    h1 { color: #f85149; font-size: 28px; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404 Not Found</h1>
    <p>The requested resource does not exist on this distribution.</p>
  </div>
</body>
</html>
